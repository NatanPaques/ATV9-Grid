<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Fotos - CSS Grid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1> Galeria de Fotos</h1>
    <p>Atividade Prática — CSS Grid Layout</p>
  </header>

  <main class="container">
    <div class="galeria">
      
      <!-- Foto 1: Destaque (2 colunas x 2 linhas) -->
      <figure class="foto-card destaque">
        <img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?q=80&w=800&auto=format&fit=crop" alt="Paisagem de estrada e montanhas">
        <figcaption class="legenda">Paisagem</figcaption>
      </figure>

      <!-- Foto 2 -->
      <figure class="foto-card">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=500&auto=format&fit=crop" alt="Rio entre montanhas">
        <figcaption class="legenda">Rio</figcaption>
      </figure>

      <!-- Foto 3 -->
      <figure class="foto-card">
        <img src="https://images.unsplash.com/photo-1439853949127-fa647821eba0?q=80&w=500&auto=format&fit=crop" alt="Lago e montanhas ao pôr do sol">
        <figcaption class="legenda">Lago</figcaption>
      </figure>

      <!-- Foto 4 -->
      <figure class="foto-card">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=500&auto=format&fit=crop" alt="Montanha coberta de neve">
        <figcaption class="legenda">Montanha</figcaption>
      </figure>

      <!-- Foto 5 -->
      <figure class="foto-card">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=500&auto=format&fit=crop" alt="Praia e mar cristalino">
        <figcaption class="legenda">Aventura</figcaption>
      </figure>

    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 — Atividade prática de CSS Grid Layout</p>
  </footer>

</body>
</html>
